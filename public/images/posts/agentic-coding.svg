<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bgAgentPost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060d"/>
      <stop offset="50%" stop-color="#070f24"/>
      <stop offset="100%" stop-color="#120c26"/>
    </linearGradient>
    <linearGradient id="neonBluePink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="postGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes feedbackFlow {
        0% { stroke-dashoffset: 200; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseEngineCore {
        0%, 100% { transform: scale(1); filter: drop-shadow(0 0 8px #f43f5e); }
        50% { transform: scale(1.08); filter: drop-shadow(0 0 25px #818cf8); }
      }
      @keyframes orbitRingSpin {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes dataPacket1 {
        0% { cx: 260px; cy: 210px; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { cx: 320px; cy: 210px; opacity: 0; }
      }
      @keyframes dataPacket2 {
        0% { cx: 480px; cy: 210px; opacity: 0; }
        20% { opacity: 1; }
        80% { opacity: 1; }
        100% { cx: 540px; cy: 210px; opacity: 0; }
      }

      .feed-loop { stroke-dasharray: 8 6; animation: feedbackFlow 3s linear infinite; }
      .core-pulse { animation: pulseEngineCore 3s ease-in-out infinite; transform-origin: 400px 190px; }
      .ring-spin { animation: orbitRingSpin 10s linear infinite; transform-origin: 400px 185px; }
      .packet-1 { animation: dataPacket1 2s linear infinite; }
      .packet-2 { animation: dataPacket2 2s linear infinite 1s; }
    </style>
  </defs>

  <rect width="800" height="420" fill="url(#bgAgentPost)"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="200" y1="0" x2="200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="420"/>
    <line x1="600" y1="0" x2="600" y2="420"/>
  </g>

  <!-- Step 1: Human Architect -->
  <g transform="translate(100, 155)">
    <rect width="160" height="110" rx="14" fill="#091228" stroke="#38bdf8" stroke-width="1.8" filter="url(#postGlow)"/>
    <text x="80" y="36" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">HUMAN ARCHITECT</text>
    <text x="80" y="68" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Intent &amp; Constraints</text>
    <text x="80" y="90" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Specification Spec</text>
  </g>

  <!-- Step 2: Agent ReAct Engine (Center) -->
  <g transform="translate(320, 125)">
    <rect width="160" height="170" rx="16" fill="#0d1738" stroke="url(#neonBluePink)" stroke-width="2.2" filter="url(#postGlow)"/>
    
    <!-- Central Brain Core -->
    <g class="core-pulse" transform="translate(80, 58)">
      <circle cx="0" cy="0" r="30" fill="#040817" stroke="#f43f5e" stroke-width="2"/>
      <text x="0" y="6" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="16" font-weight="bold" text-anchor="middle">AI</text>
    </g>

    <!-- Rotating Tech Ring -->
    <g class="ring-spin">
      <ellipse cx="80" cy="58" rx="42" ry="42" fill="none" stroke="rgba(56, 189, 248, 0.45)" stroke-dasharray="8 6" stroke-width="1.5"/>
      <circle cx="122" cy="58" r="3.5" fill="#38bdf8"/>
    </g>
    
    <text x="80" y="112" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">AUTONOMOUS</text>
    <text x="80" y="132" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">Read ➜ Act ➜ Verify</text>
    <text x="80" y="152" fill="#cbd5e1" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Multi-File Edit Engine</text>
  </g>

  <!-- Step 3: Verified Codebase -->
  <g transform="translate(540, 155)">
    <rect width="160" height="110" rx="14" fill="#091824" stroke="#00ff9d" stroke-width="1.8" filter="url(#postGlow)"/>
    <text x="80" y="36" fill="#00ff9d" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">VERIFIED BUILD</text>
    <text x="80" y="68" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Clean Execution</text>
    <text x="80" y="90" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Passing Tests &amp; Lint</text>
  </g>

  <!-- Connecting Arrows -->
  <g stroke="url(#neonBluePink)" stroke-width="2.5" fill="none">
    <path d="M 260,210 L 320,210"/>
    <path d="M 480,210 L 540,210"/>
  </g>

  <!-- Travelling Data Packets -->
  <circle class="packet-1" cx="260" cy="210" r="4.5" fill="#38bdf8" filter="url(#postGlow)"/>
  <circle class="packet-2" cx="480" cy="210" r="4.5" fill="#00ff9d" filter="url(#postGlow)"/>

  <!-- Feedback Return Loop Arrow with Continuous Flow -->
  <path class="feed-loop" d="M 400,295 C 400,360 180,360 180,265" fill="none" stroke="rgba(56, 189, 248, 0.65)" stroke-width="2.2" filter="url(#postGlow)"/>
  
  <rect x="230" y="350" width="220" height="26" rx="6" fill="#080e22" stroke="rgba(56, 189, 248, 0.35)"/>
  <text x="340" y="367" fill="#38bdf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">⚡ Self-Correction Loop</text>

  <!-- Title Top -->
  <text x="400" y="65" fill="#ffffff" font-family="'Outfit', sans-serif" font-size="22" font-weight="800" text-anchor="middle" letter-spacing="2">AGENTIC CODING WORKFLOWS</text>
</svg>
