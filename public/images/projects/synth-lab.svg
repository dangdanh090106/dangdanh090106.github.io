<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="bgSynth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060d"/>
      <stop offset="100%" stop-color="#140a26"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f7ff"/>
      <stop offset="50%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bgSynth)"/>

  <!-- Equalizer Spectrum Bars -->
  <g fill="#00f7ff" opacity="0.35">
    <rect x="80" y="240" width="8" height="40" rx="4"/>
    <rect x="96" y="210" width="8" height="70" rx="4"/>
    <rect x="112" y="190" width="8" height="90" rx="4"/>
    <rect x="128" y="230" width="8" height="50" rx="4"/>
    <rect x="144" y="170" width="8" height="110" rx="4"/>
    <rect x="160" y="200" width="8" height="80" rx="4"/>
    <rect x="176" y="150" width="8" height="130" rx="4"/>
    <rect x="192" y="180" width="8" height="100" rx="4"/>
    <rect x="208" y="220" width="8" height="60" rx="4"/>
    
    <rect x="380" y="220" width="8" height="60" rx="4" fill="#ff007f"/>
    <rect x="396" y="170" width="8" height="110" rx="4" fill="#ff007f"/>
    <rect x="412" y="140" width="8" height="140" rx="4" fill="#ff007f"/>
    <rect x="428" y="190" width="8" height="90" rx="4" fill="#ff007f"/>
    <rect x="444" y="160" width="8" height="120" rx="4" fill="#ff007f"/>
    <rect x="460" y="210" width="8" height="70" rx="4" fill="#ff007f"/>
    <rect x="476" y="180" width="8" height="100" rx="4" fill="#ff007f"/>
    <rect x="492" y="230" width="8" height="50" rx="4" fill="#ff007f"/>
    <rect x="508" y="250" width="8" height="30" rx="4" fill="#ff007f"/>
  </g>

  <!-- Glowing Oscilloscope Sine Waves -->
  <path d="M 60,180 Q 120,40 180,180 T 300,180 T 420,180 T 540,180" fill="none" stroke="url(#waveGrad)" stroke-width="4"/>
  <path d="M 60,180 Q 150,280 240,180 T 420,180 T 540,180" fill="none" stroke="#00f7ff" stroke-width="2" opacity="0.6"/>

  <!-- Frequency Grid Overlay -->
  <line x1="60" y1="180" x2="540" y2="180" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="4 4"/>
  <line x1="300" y1="60" x2="300" y2="300" stroke="rgba(255,255,255,0.15)" stroke-width="1.5" stroke-dasharray="4 4"/>

  <!-- Badges -->
  <rect x="60" y="40" width="160" height="28" rx="6" fill="rgba(168, 85, 247, 0.2)" stroke="rgba(168, 85, 247, 0.5)"/>
  <text x="140" y="58" fill="#d8b4fe" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">WEB_AUDIO_SYNTH</text>
</svg>
