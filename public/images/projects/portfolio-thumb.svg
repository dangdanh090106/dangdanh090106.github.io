<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="bgPort" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060d"/>
      <stop offset="50%" stop-color="#090f22"/>
      <stop offset="100%" stop-color="#121833"/>
    </linearGradient>
    <linearGradient id="cyberBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f7ff"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
  </defs>

  <rect width="600" height="360" fill="url(#bgPort)"/>

  <!-- Browser / UI Window Frame Mockup -->
  <rect x="70" y="45" width="460" height="270" rx="14" fill="#080c1a" stroke="url(#cyberBorder)" stroke-width="2"/>
  
  <!-- Window Header -->
  <path d="M 70,59 C 70,51 76,45 84,45 L 516,45 C 524,45 530,51 530,59 L 530,78 L 70,78 Z" fill="#0c1226"/>
  <circle cx="95" cy="62" r="5" fill="#ef4444"/>
  <circle cx="112" cy="62" r="5" fill="#f59e0b"/>
  <circle cx="129" cy="62" r="5" fill="#10b981"/>

  <rect x="160" y="54" width="280" height="16" rx="4" fill="#04060d" stroke="rgba(255,255,255,0.1)"/>
  <text x="300" y="66" fill="#8292ab" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">dangdanh090106.github.io</text>

  <!-- Cyber Web Elements -->
  <!-- Header Bar Inside -->
  <line x1="100" y1="105" x2="180" y2="105" stroke="#00f7ff" stroke-width="6" stroke-linecap="round"/>
  <line x1="390" y1="105" x2="420" y2="105" stroke="#8292ab" stroke-width="4" stroke-linecap="round"/>
  <line x1="435" y1="105" x2="465" y2="105" stroke="#8292ab" stroke-width="4" stroke-linecap="round"/>
  <line x1="480" y1="105" x2="500" y2="105" stroke="#00f7ff" stroke-width="4" stroke-linecap="round"/>

  <!-- Hero Content inside frame -->
  <line x1="100" y1="145" x2="260" y2="145" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  <line x1="100" y1="168" x2="310" y2="168" stroke="url(#cyberBorder)" stroke-width="14" stroke-linecap="round"/>
  <line x1="100" y1="195" x2="330" y2="195" stroke="#8292ab" stroke-width="5" stroke-linecap="round"/>
  <line x1="100" y1="210" x2="280" y2="210" stroke="#8292ab" stroke-width="5" stroke-linecap="round"/>

  <!-- Buttons inside frame -->
  <rect x="100" y="235" width="85" height="28" rx="6" fill="#00f7ff"/>
  <rect x="195" y="235" width="85" height="28" rx="6" fill="#141c38" stroke="#00f7ff"/>

  <!-- Holographic Core Visual on right side of frame -->
  <circle cx="430" cy="190" r="55" fill="none" stroke="rgba(0, 247, 255, 0.4)" stroke-dasharray="4 4"/>
  <circle cx="430" cy="190" r="35" fill="none" stroke="rgba(255, 0, 127, 0.5)"/>
  <circle cx="430" cy="190" r="18" fill="url(#cyberBorder)"/>
</svg>
