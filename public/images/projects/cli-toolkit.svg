<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="bgCli" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03050c"/>
      <stop offset="50%" stop-color="#080e1e"/>
      <stop offset="100%" stop-color="#0d1527"/>
    </linearGradient>
    <linearGradient id="neonGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00f7ff"/>
    </linearGradient>
    <linearGradient id="progressGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="50%" stop-color="#00f7ff"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="terminalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes blinkCursor {
        0%, 49% { opacity: 1; }
        50%, 100% { opacity: 0; }
      }
      @keyframes fillProgress {
        0% { width: 0px; }
        60% { width: 400px; }
        85% { width: 400px; opacity: 1; }
        95% { width: 400px; opacity: 0.8; }
        100% { width: 0px; opacity: 0; }
      }
      @keyframes streamScanline {
        0% { transform: translateY(0); opacity: 0; }
        15% { opacity: 0.6; }
        85% { opacity: 0.6; }
        100% { transform: translateY(280px); opacity: 0; }
      }
      @keyframes pulseLed {
        0%, 100% { opacity: 1; transform: scale(1); filter: drop-shadow(0 0 6px #00ff9d); }
        50% { opacity: 0.4; transform: scale(0.85); filter: drop-shadow(0 0 2px #00ff9d); }
      }
      @keyframes lineStagger {
        0%, 20% { opacity: 0; transform: translateY(6px); }
        30%, 100% { opacity: 1; transform: translateY(0); }
      }
      .cursor-blink { animation: blinkCursor 0.9s infinite; }
      .bar-fill { animation: fillProgress 6s cubic-bezier(0.16, 1, 0.3, 1) infinite; }
      .scan-beam { animation: streamScanline 4s linear infinite; }
      .live-led { animation: pulseLed 2s ease-in-out infinite; transform-origin: 505px 58px; }
      .cli-anim-line-1 { animation: lineStagger 6s ease-in-out infinite; }
      .cli-anim-line-2 { animation: lineStagger 6s ease-in-out infinite 0.8s; }
      .cli-anim-line-3 { animation: lineStagger 6s ease-in-out infinite 1.6s; }
      .cli-anim-line-4 { animation: lineStagger 6s ease-in-out infinite 2.4s; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="360" fill="url(#bgCli)"/>

  <!-- Matrix subtle grid -->
  <g opacity="0.08" stroke="#00f7ff" stroke-width="1">
    <line x1="0" y1="90" x2="600" y2="90"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="270" x2="600" y2="270"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
  </g>

  <!-- Terminal Window Frame -->
  <rect x="50" y="32" width="500" height="295" rx="14" fill="#040814" stroke="rgba(0, 255, 157, 0.45)" stroke-width="1.8" filter="url(#terminalGlow)"/>
  
  <!-- Window Titlebar -->
  <path d="M 50,46 C 50,38 56,32 64,32 L 536,32 C 544,32 550,38 550,46 L 550,68 L 50,68 Z" fill="#091224" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
  
  <!-- Mac-style window controls -->
  <circle cx="75" cy="50" r="5" fill="#f43f5e"/>
  <circle cx="93" cy="50" r="5" fill="#fbbf24"/>
  <circle cx="111" cy="50" r="5" fill="#10b981"/>

  <text x="300" y="54" fill="#94a3b8" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle" font-weight="600">zsh • dev-toolkit @dangdanh (node-v22)</text>
  
  <!-- Live Status LED -->
  <circle class="live-led" cx="525" cy="50" r="4" fill="#00ff9d"/>

  <!-- Terminal Scanline Beam -->
  <g class="scan-beam">
    <rect x="52" y="70" width="496" height="2" fill="url(#neonGreen)" opacity="0.7" filter="url(#terminalGlow)"/>
  </g>

  <!-- Terminal Content Lines -->
  <g font-family="'JetBrains Mono', monospace" font-size="12">
    <!-- Command Line -->
    <g class="cli-anim-line-1">
      <text x="80" y="105" fill="#38bdf8" font-weight="bold">➜</text>
      <text x="100" y="105" fill="#00ff9d" font-weight="bold">~/workspace</text>
      <text x="200" y="105" fill="#ffffff">$ dev-toolkit build --prod --turbo</text>
    </g>

    <!-- Step 1 -->
    <g class="cli-anim-line-2">
      <text x="80" y="138" fill="#00ff9d">✔</text>
      <text x="100" y="138" fill="#cbd5e1">Parsing AST dependencies (48 modules)</text>
      <text x="440" y="138" fill="#00ff9d" font-weight="bold">[PASS]</text>
    </g>

    <!-- Step 2 -->
    <g class="cli-anim-line-3">
      <text x="80" y="168" fill="#00ff9d">✔</text>
      <text x="100" y="168" fill="#cbd5e1">Type-check &amp; strict schema verification</text>
      <text x="455" y="168" fill="#38bdf8">[0.08s]</text>
    </g>

    <!-- Animated Progress Bar Container -->
    <rect x="80" y="190" width="420" height="8" rx="4" fill="#111d33" stroke="rgba(255,255,255,0.08)"/>
    <rect class="bar-fill" x="80" y="190" width="400" height="8" rx="4" fill="url(#progressGrad)" filter="url(#terminalGlow)"/>

    <!-- Step 3 / Result -->
    <g class="cli-anim-line-4">
      <text x="80" y="235" fill="#38bdf8">⚡</text>
      <text x="100" y="235" fill="#38bdf8" font-weight="bold">Compiled target [x64, arm64] in 320ms</text>
      <text x="100" y="260" fill="#94a3b8">Binary size: 1.8MB • Zero runtime dependencies</text>
    </g>

    <!-- Active prompt with blinking cursor -->
    <g transform="translate(80, 295)">
      <text x="0" y="0" fill="#38bdf8" font-weight="bold">➜</text>
      <text x="20" y="0" fill="#00ff9d" font-weight="bold">~/workspace</text>
      <text x="120" y="0" fill="#ffffff">$ _</text>
      <rect class="cursor-blink" x="135" y="-11" width="8" height="14" fill="#00ff9d"/>
    </g>
  </g>
</svg>
