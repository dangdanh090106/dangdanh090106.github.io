<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bgAgentPost" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060d"/>
      <stop offset="50%" stop-color="#081026"/>
      <stop offset="100%" stop-color="#120c26"/>
    </linearGradient>
    <linearGradient id="neonBluePink" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f7ff"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#bgAgentPost)"/>

  <!-- Autonomous ReAct Workflow Diagram -->
  <!-- Step 1: Human Architect -->
  <g transform="translate(100, 160)">
    <rect width="160" height="100" rx="12" fill="#0b1226" stroke="#00f7ff" stroke-width="2"/>
    <text x="80" y="35" fill="#00f7ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">HUMAN ARCHITECT</text>
    <text x="80" y="65" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Goal &amp; Constraints</text>
    <text x="80" y="85" fill="#8292ab" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Intent &amp; Spec</text>
  </g>

  <!-- Step 2: Agent ReAct Engine (Center) -->
  <g transform="translate(320, 130)">
    <rect width="160" height="160" rx="16" fill="#0f1733" stroke="url(#neonBluePink)" stroke-width="2.5"/>
    <circle cx="80" cy="55" r="28" fill="#04060d" stroke="#ff007f" stroke-width="2"/>
    <text x="80" y="60" fill="#ff007f" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle">AI</text>
    
    <text x="80" y="105" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">AUTONOMOUS</text>
    <text x="80" y="125" fill="#00f7ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">Read ➔ Act ➔ Verify</text>
    <text x="80" y="145" fill="#8292ab" font-family="'JetBrains Mono', monospace" font-size="10" text-anchor="middle">Multi-File Edit</text>
  </g>

  <!-- Step 3: Verified Codebase -->
  <g transform="translate(540, 160)">
    <rect width="160" height="100" rx="12" fill="#0b1226" stroke="#00ff9d" stroke-width="2"/>
    <text x="80" y="35" fill="#00ff9d" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">VERIFIED BUILD</text>
    <text x="80" y="65" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">Clean Execution</text>
    <text x="80" y="85" fill="#8292ab" font-family="'JetBrains Mono', monospace" font-size="11" text-anchor="middle">Passing Tests</text>
  </g>

  <!-- Connecting Arrows -->
  <g stroke="url(#neonBluePink)" stroke-width="2.5" fill="none">
    <path d="M 260,210 L 320,210" marker-end="url(#arrow)"/>
    <path d="M 480,210 L 540,210"/>
  </g>

  <!-- Feedback Return Loop Arrow -->
  <path d="M 400,290 C 400,345 200,345 180,260" fill="none" stroke="rgba(0, 247, 255, 0.4)" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="290" y="340" fill="#8292ab" font-family="'JetBrains Mono', monospace" font-size="11">Self-Correction Feedback Loop</text>

  <!-- Title -->
  <text x="400" y="55" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="2">AGENTIC CODING WORKFLOWS</text>
</svg>
