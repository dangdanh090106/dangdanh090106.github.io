<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bgPerf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03050c"/>
      <stop offset="50%" stop-color="#071420"/>
      <stop offset="100%" stop-color="#0a1a1c"/>
    </linearGradient>
    <linearGradient id="perfGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00ff9d"/>
      <stop offset="100%" stop-color="#00f7ff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#bgPerf)"/>

  <!-- Speedometer / Gauge -->
  <g transform="translate(400, 210)">
    <!-- Outer Track -->
    <path d="M -130,50 A 140 140 0 1 1 130,50" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="18" stroke-linecap="round"/>
    
    <!-- Active 100% Track -->
    <path d="M -130,50 A 140 140 0 1 1 130,50" fill="none" stroke="url(#perfGrad)" stroke-width="18" stroke-linecap="round"/>

    <!-- Score Text -->
    <text x="0" y="-10" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="64" font-weight="900" text-anchor="middle">100</text>
    <text x="0" y="25" fill="#00ff9d" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" text-anchor="middle" letter-spacing="3">PERFECT SCORE</text>
  </g>

  <!-- Metric Badges Left -->
  <g transform="translate(100, 150)">
    <rect width="140" height="60" rx="8" fill="#091424" stroke="rgba(0, 247, 255, 0.3)"/>
    <text x="15" y="25" fill="#8292ab" font-family="'JetBrains Mono', monospace" font-size="11">FIRST CONTENTFUL</text>
    <text x="15" y="48" fill="#00f7ff" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold">0.3s</text>
  </g>

  <g transform="translate(100, 230)">
    <rect width="140" height="60" rx="8" fill="#091424" stroke="rgba(0, 255, 157, 0.3)"/>
    <text x="15" y="25" fill="#8292ab" font-family="'JetBrains Mono', monospace" font-size="11">TIME TO INTERACTIVE</text>
    <text x="15" y="48" fill="#00ff9d" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold">0.4s</text>
  </g>

  <!-- Metric Badges Right -->
  <g transform="translate(560, 150)">
    <rect width="140" height="60" rx="8" fill="#091424" stroke="rgba(0, 255, 157, 0.3)"/>
    <text x="15" y="25" fill="#8292ab" font-family="'JetBrains Mono', monospace" font-size="11">TOTAL BLOCKING</text>
    <text x="15" y="48" fill="#00ff9d" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold">0 ms</text>
  </g>

  <g transform="translate(560, 230)">
    <rect width="140" height="60" rx="8" fill="#091424" stroke="rgba(0, 247, 255, 0.3)"/>
    <text x="15" y="25" fill="#8292ab" font-family="'JetBrains Mono', monospace" font-size="11">CUMULATIVE SHIFT</text>
    <text x="15" y="48" fill="#00f7ff" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold">0.00</text>
  </g>

  <!-- Title -->
  <text x="400" y="55" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="2">STATIC WEB PERFORMANCE OPTIMIZATION</text>
</svg>
