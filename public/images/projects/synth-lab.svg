<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="bgSynth" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060d"/>
      <stop offset="50%" stop-color="#0f0c24"/>
      <stop offset="100%" stop-color="#180926"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <linearGradient id="barGradCyan" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="barGradPink" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="synthGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <style>
      @keyframes eqBounce1 {
        0%, 100% { transform: scaleY(0.25); }
        50% { transform: scaleY(0.95); }
      }
      @keyframes eqBounce2 {
        0%, 100% { transform: scaleY(0.85); }
        50% { transform: scaleY(0.3); }
      }
      @keyframes eqBounce3 {
        0%, 100% { transform: scaleY(0.4); }
        50% { transform: scaleY(1); }
      }
      @keyframes eqBounce4 {
        0%, 100% { transform: scaleY(0.9); }
        50% { transform: scaleY(0.45); }
      }
      @keyframes waveFlow {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: -400; }
      }
      @keyframes dialSpin {
        0% { transform: rotate(0deg); }
        50% { transform: rotate(140deg); }
        100% { transform: rotate(0deg); }
      }
      @keyframes radarSweep {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes rippleExpand {
        0% { r: 10px; opacity: 0.9; }
        100% { r: 75px; opacity: 0; }
      }

      .eq-b1 { animation: eqBounce1 1.2s ease-in-out infinite; transform-origin: bottom; }
      .eq-b2 { animation: eqBounce2 1.5s ease-in-out infinite 0.15s; transform-origin: bottom; }
      .eq-b3 { animation: eqBounce3 1.1s ease-in-out infinite 0.3s; transform-origin: bottom; }
      .eq-b4 { animation: eqBounce4 1.4s ease-in-out infinite 0.2s; transform-origin: bottom; }
      .wave-anim { stroke-dasharray: 20 8; animation: waveFlow 4s linear infinite; }
      .wave-sub { stroke-dasharray: 12 12; animation: waveFlow 6s linear infinite reverse; }
      .dial-needle { animation: dialSpin 5s ease-in-out infinite alternate; transform-origin: 480px 100px; }
      .radar-arm { animation: radarSweep 4s linear infinite; transform-origin: 120px 100px; }
      .sound-ripple { animation: rippleExpand 2.4s ease-out infinite; }
      .sound-ripple-delayed { animation: rippleExpand 2.4s ease-out infinite 1.2s; }
    </style>
  </defs>

  <rect width="600" height="360" fill="url(#bgSynth)"/>

  <!-- Frequency Grid Overlay -->
  <g opacity="0.12" stroke="#818cf8" stroke-width="1">
    <line x1="50" y1="60" x2="550" y2="60"/>
    <line x1="50" y1="120" x2="550" y2="120"/>
    <line x1="50" y1="180" x2="550" y2="180"/>
    <line x1="50" y1="240" x2="550" y2="240"/>
    <line x1="50" y1="300" x2="550" y2="300"/>
    <line x1="120" y1="40" x2="120" y2="320"/>
    <line x1="210" y1="40" x2="210" y2="320"/>
    <line x1="300" y1="40" x2="300" y2="320"/>
    <line x1="390" y1="40" x2="390" y2="320"/>
    <line x1="480" y1="40" x2="480" y2="320"/>
  </g>

  <!-- Left Radar Visualizer -->
  <g transform="translate(0, 0)">
    <circle cx="120" cy="100" r="45" fill="#080c1d" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5"/>
    <circle cx="120" cy="100" r="28" fill="none" stroke="rgba(56, 189, 248, 0.25)" stroke-width="1"/>
    <circle cx="120" cy="100" r="12" fill="rgba(56, 189, 248, 0.2)" stroke="#38bdf8" stroke-width="1"/>
    
    <!-- Radar Arm -->
    <line class="radar-arm" x1="120" y1="100" x2="160" y2="75" stroke="#38bdf8" stroke-width="2" filter="url(#synthGlow)"/>
    
    <!-- Sound Waves Ripples -->
    <circle class="sound-ripple" cx="120" cy="100" r="10" fill="none" stroke="#38bdf8" stroke-width="1.5"/>
    <circle class="sound-ripple-delayed" cx="120" cy="100" r="10" fill="none" stroke="#818cf8" stroke-width="1.2"/>
  </g>

  <!-- Center Oscilloscope Header -->
  <g transform="translate(300, 75)">
    <rect x="-90" y="-18" width="180" height="34" rx="8" fill="#0c112b" stroke="rgba(129, 140, 248, 0.4)" stroke-width="1.2"/>
    <text x="0" y="4" fill="#818cf8" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle" letter-spacing="1">AUDIO_ENGINE // 44.1kHz</text>
  </g>

  <!-- Right Frequency Dial Knob -->
  <g transform="translate(0, 0)">
    <circle cx="480" cy="100" r="42" fill="#0c1024" stroke="rgba(244, 63, 94, 0.45)" stroke-width="1.5"/>
    <circle cx="480" cy="100" r="32" fill="#14102c" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1"/>
    
    <!-- Dial Needle Pointer -->
    <line class="dial-needle" x1="480" y1="100" x2="480" y2="74" stroke="#f43f5e" stroke-width="3" stroke-linecap="round" filter="url(#synthGlow)"/>
    <circle cx="480" cy="100" r="5" fill="#f43f5e"/>
    <text x="480" y="152" fill="#f43f5e" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" font-weight="bold">LFO RATE</text>
  </g>

  <!-- Glowing Live Oscilloscope Sine Waves -->
  <path class="wave-anim" d="M 40,185 Q 110,105 180,185 T 320,185 T 460,185 T 560,185" fill="none" stroke="url(#waveGrad)" stroke-width="3.5" filter="url(#synthGlow)"/>
  <path class="wave-sub" d="M 40,185 Q 100,245 180,185 T 320,185 T 460,185 T 560,185" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.6"/>

  <!-- Dynamic Bouncing Equalizer Spectrum Bars at Bottom -->
  <g transform="translate(0, 310)">
    <!-- Cyan Left Channel -->
    <g class="eq-b1"><rect x="70" y="-100" width="10" height="100" rx="4" fill="url(#barGradCyan)" filter="url(#synthGlow)"/></g>
    <g class="eq-b3"><rect x="86" y="-120" width="10" height="120" rx="4" fill="url(#barGradCyan)" filter="url(#synthGlow)"/></g>
    <g class="eq-b2"><rect x="102" y="-70" width="10" height="70" rx="4" fill="url(#barGradCyan)"/></g>
    <g class="eq-b4"><rect x="118" y="-135" width="10" height="135" rx="4" fill="url(#barGradCyan)" filter="url(#synthGlow)"/></g>
    <g class="eq-b1"><rect x="134" y="-90" width="10" height="90" rx="4" fill="url(#barGradCyan)"/></g>
    <g class="eq-b3"><rect x="150" y="-115" width="10" height="115" rx="4" fill="url(#barGradCyan)"/></g>
    <g class="eq-b2"><rect x="166" y="-60" width="10" height="60" rx="4" fill="url(#barGradCyan)"/></g>
    <g class="eq-b4"><rect x="182" y="-105" width="10" height="105" rx="4" fill="url(#barGradCyan)"/></g>

    <!-- Center Bridge (Violet) -->
    <g class="eq-b3"><rect x="260" y="-80" width="10" height="80" rx="4" fill="#818cf8"/></g>
    <g class="eq-b1"><rect x="276" y="-130" width="10" height="130" rx="4" fill="#818cf8" filter="url(#synthGlow)"/></g>
    <g class="eq-b4"><rect x="292" y="-150" width="10" height="150" rx="4" fill="#ffffff" filter="url(#synthGlow)"/></g>
    <g class="eq-b2"><rect x="308" y="-125" width="10" height="125" rx="4" fill="#818cf8" filter="url(#synthGlow)"/></g>
    <g class="eq-b1"><rect x="324" y="-85" width="10" height="85" rx="4" fill="#818cf8"/></g>

    <!-- Pink Right Channel -->
    <g class="eq-b2"><rect x="402" y="-95" width="10" height="95" rx="4" fill="url(#barGradPink)"/></g>
    <g class="eq-b4"><rect x="418" y="-135" width="10" height="135" rx="4" fill="url(#barGradPink)" filter="url(#synthGlow)"/></g>
    <g class="eq-b1"><rect x="434" y="-75" width="10" height="75" rx="4" fill="url(#barGradPink)"/></g>
    <g class="eq-b3"><rect x="450" y="-120" width="10" height="120" rx="4" fill="url(#barGradPink)" filter="url(#synthGlow)"/></g>
    <g class="eq-b2"><rect x="466" y="-140" width="10" height="140" rx="4" fill="url(#barGradPink)" filter="url(#synthGlow)"/></g>
    <g class="eq-b1"><rect x="482" y="-65" width="10" height="65" rx="4" fill="url(#barGradPink)"/></g>
    <g class="eq-b4"><rect x="498" y="-110" width="10" height="110" rx="4" fill="url(#barGradPink)"/></g>
    <g class="eq-b3"><rect x="514" y="-55" width="10" height="55" rx="4" fill="url(#barGradPink)"/></g>
  </g>
</svg>
