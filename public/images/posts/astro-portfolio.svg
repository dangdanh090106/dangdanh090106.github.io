<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 420" width="800" height="420">
  <defs>
    <linearGradient id="bgAstro" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#03050c"/>
      <stop offset="50%" stop-color="#0a1024"/>
      <stop offset="100%" stop-color="#140a24"/>
    </linearGradient>
    <linearGradient id="astroGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#00f7ff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="420" fill="url(#bgAstro)"/>

  <!-- Matrix Stars -->
  <g fill="#ffffff" opacity="0.4">
    <circle cx="80" cy="70" r="1.5"/>
    <circle cx="150" cy="190" r="1.2"/>
    <circle cx="280" cy="90" r="2"/>
    <circle cx="430" cy="60" r="1.5"/>
    <circle cx="680" cy="100" r="2.5"/>
    <circle cx="730" cy="220" r="1.2"/>
    <circle cx="620" cy="330" r="2"/>
    <circle cx="180" cy="340" r="1.8"/>
  </g>

  <!-- Central Rocket / Core Icon Motif -->
  <g transform="translate(400, 190)">
    <circle cx="0" cy="0" r="95" fill="none" stroke="rgba(0, 247, 255, 0.25)" stroke-dasharray="6 6"/>
    <circle cx="0" cy="0" r="65" fill="none" stroke="url(#astroGrad)" stroke-width="2"/>
    
    <!-- Stylized Astro Rocket Spark -->
    <path d="M 0,-45 C 18,-20 22,25 0,40 C -22,25 -18,-20 0,-45 Z" fill="url(#astroGrad)"/>
    <circle cx="0" cy="-5" r="8" fill="#ffffff"/>
    <polygon points="-12,20 -28,38 -10,32" fill="#ff007f"/>
    <polygon points="12,20 28,38 10,32" fill="#00f7ff"/>
  </g>

  <!-- Islands Architecture Cards floating -->
  <!-- Island 1: Static HTML -->
  <g transform="translate(140, 130)">
    <rect width="160" height="85" rx="10" fill="#0c1226" stroke="#00f7ff" stroke-width="1.5"/>
    <text x="20" y="32" fill="#00f7ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">ISLAND 01</text>
    <text x="20" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold">Zero JS Default</text>
    <text x="20" y="72" fill="#8292ab" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Fast Pure HTML</text>
  </g>

  <!-- Island 2: Content Collections -->
  <g transform="translate(500, 130)">
    <rect width="160" height="85" rx="10" fill="#0c1226" stroke="#a855f7" stroke-width="1.5"/>
    <text x="20" y="32" fill="#a855f7" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold">CONTENT LAYER</text>
    <text x="20" y="55" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="14" font-weight="bold">Git Markdown</text>
    <text x="20" y="72" fill="#8292ab" font-family="'Plus Jakarta Sans', sans-serif" font-size="11">Zod Type Safety</text>
  </g>

  <!-- Island 3: GitHub Actions -->
  <g transform="translate(320, 310)">
    <rect width="160" height="65" rx="10" fill="#0c1226" stroke="#ff007f" stroke-width="1.5"/>
    <text x="80" y="28" fill="#ff007f" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">CI/CD DEPLOY</text>
    <text x="80" y="50" fill="#ffffff" font-family="'Plus Jakarta Sans', sans-serif" font-size="13" font-weight="bold" text-anchor="middle">GitHub Pages</text>
  </g>

  <!-- Title Watermark -->
  <text x="400" y="50" fill="#ffffff" font-family="'Space Grotesk', sans-serif" font-size="20" font-weight="bold" text-anchor="middle" letter-spacing="2">ASTRO 5 + GITHUB PAGES</text>
</svg>
