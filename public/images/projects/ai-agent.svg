<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" width="600" height="360">
  <defs>
    <linearGradient id="bgAgent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04060d"/>
      <stop offset="100%" stop-color="#0c1328"/>
    </linearGradient>
    <linearGradient id="gradCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f7ff"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="gradPink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glowEffect" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="600" height="360" fill="url(#bgAgent)"/>

  <!-- Matrix Grid -->
  <g opacity="0.12" stroke="#00f7ff" stroke-width="1">
    <line x1="0" y1="60" x2="600" y2="60"/>
    <line x1="0" y1="120" x2="600" y2="120"/>
    <line x1="0" y1="180" x2="600" y2="180"/>
    <line x1="0" y1="240" x2="600" y2="240"/>
    <line x1="0" y1="300" x2="600" y2="300"/>
    <line x1="100" y1="0" x2="100" y2="360"/>
    <line x1="200" y1="0" x2="200" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="400" y1="0" x2="400" y2="360"/>
    <line x1="500" y1="0" x2="500" y2="360"/>
  </g>

  <!-- Neural Network Connections -->
  <g stroke="rgba(0, 247, 255, 0.4)" stroke-width="2">
    <line x1="120" y1="100" x2="240" y2="180"/>
    <line x1="120" y1="260" x2="240" y2="180"/>
    <line x1="240" y1="180" x2="360" y2="120"/>
    <line x1="240" y1="180" x2="360" y2="240"/>
    <line x1="360" y1="120" x2="480" y2="180"/>
    <line x1="360" y1="240" x2="480" y2="180"/>
    <line x1="360" y1="120" x2="360" y2="240" stroke="rgba(255, 0, 127, 0.5)"/>
  </g>

  <!-- Center Core Ring -->
  <circle cx="300" cy="180" r="90" fill="none" stroke="rgba(0, 247, 255, 0.2)" stroke-dasharray="6 6"/>
  <circle cx="300" cy="180" r="65" fill="none" stroke="rgba(168, 85, 247, 0.35)"/>

  <!-- Autonomous Agent Core Node -->
  <circle cx="240" cy="180" r="28" fill="#04060d" stroke="url(#gradCyan)" stroke-width="3" filter="url(#glowEffect)"/>
  <text x="240" y="185" fill="#00f7ff" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="bold" text-anchor="middle">LLM</text>

  <circle cx="360" cy="120" r="22" fill="#04060d" stroke="url(#gradPink)" stroke-width="2.5" filter="url(#glowEffect)"/>
  <text x="360" y="125" fill="#ff007f" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">RAG</text>

  <circle cx="360" cy="240" r="22" fill="#04060d" stroke="#00ff9d" stroke-width="2.5" filter="url(#glowEffect)"/>
  <text x="360" y="245" fill="#00ff9d" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">TOOL</text>

  <!-- Peripheral Nodes -->
  <circle cx="120" cy="100" r="14" fill="#00f7ff" opacity="0.8"/>
  <circle cx="120" cy="260" r="14" fill="#3b82f6" opacity="0.8"/>
  <circle cx="480" cy="180" r="18" fill="#ff007f" filter="url(#glowEffect)"/>

  <!-- Code / Data HUD elements -->
  <rect x="40" y="30" width="130" height="26" rx="6" fill="rgba(0, 247, 255, 0.12)" stroke="rgba(0, 247, 255, 0.4)"/>
  <text x="105" y="47" fill="#00f7ff" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">AGENTIC_V2.6</text>

  <rect x="430" y="30" width="130" height="26" rx="6" fill="rgba(0, 255, 157, 0.12)" stroke="rgba(0, 255, 157, 0.4)"/>
  <circle cx="445" cy="43" r="4" fill="#00ff9d"/>
  <text x="492" y="47" fill="#00ff9d" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="bold" text-anchor="middle">STATUS: ACTIVE</text>
</svg>
